<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Negative Harmony Transposition</title>
    <link rel="stylesheet" href="nhwg.css">
    <script type="text/javascript" src="nhwg.js"></script>
</head>

<body>

    <header>
        <h1>Negative Harmony Online Transpose</h1>
    </header>

    <section>
        <!-- TONALITY SELECTOR -->
        <article>
            <div class="tooltip">Key:
                <select name="tone_list" id="tone" class="line-item key">
                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="D">D</option>
                    <option value="D#">D#</option>
                    <option value="E">E</option>
                    <option value="E#">E#</option>
                    <option value="F">F</option>
                    <option value="F#">F#</option>
                    <option value="G">G</option>
                    <option value="G#">G#</option>
                    <option value="A">A</option>
                    <option value="A#">A#</option>
                    <option value="B">B</option>
                </select>
                <span class="tooltiptext">Choose your tonality</span>
            </div>
        </article>

        <!-- SEQUENCE TRANSPOSER -->
        <article>
            <h2>Key Sequence Transposer</h2>
            <div class="container">
                <!-- Ligne 1 : Champ de saisie + Bouton écoute originale -->
                <div class="row-group">
                    <input type="text" id="notes" class="line-item" placeholder="Ex: C D E F G A B">
                    <button onclick="playOriginalMelody()" class="line-item btn-audio">Play 🔊</button>
                </div>

                <!-- Ligne 2 : Bouton Transpose Seul -->
                <button onclick="transposer()" class="line-item btn-transpose">Transpose</button>

                <!-- Ligne 3 : Résultat + Bouton écoute transposée -->
                <div class="row-group">
                    <div id="resultatNotes" class="line-item result"></div>
                    <button onclick="playTransposedMelody()" class="line-item btn-audio">Play 🎵</button>
                </div>
            </div>
        </article>

        <!-- CHORD TRANSPOSER -->
        <article>
            <h2>Chord Transposer</h2>
            <div class="container">
                <!-- Ligne 1 : Champ de saisie + Bouton écoute originale -->
                <div class="row-group">
                    <input type="text" id="accord" class="line-item" placeholder="Ex: Cmaj7, Dm7, Bm7b5">
                    <button onclick="playOriginalChord()" class="line-item btn-audio">Play 🔊</button>
                </div>

                <!-- Ligne 2 : Bouton Transpose Seul -->
                <button onclick="transposer()" class="line-item btn-transpose">Transpose</button>

                <!-- Ligne 3 : Résultat + Bouton écoute transposée -->
                <div class="row-group">
                    <div id="resultatAccord" class="line-item result"></div>
                    <button onclick="playTransposedChord()" class="line-item btn-audio">Play 🎵</button>
                </div>
            </div>
        </article>

        <article>
            <h2>What is it ?</h2>
            <div class="feature-item">Simple Tool for Negative Harmony.</div>
        </article>
    </section>

    <div class="footer">
        <p>Email: contact@ordrumbox.com</p>
        <p>&copy; 2024 Ordrumbox Team. | MIT License</p>
    </div>

</body>
</html>
